<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CME Anatomy Viewer{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: {
                            950: '#000000',
                            900: '#050505',
                            800: '#0a0a0a',
                            700: '#111111',
                            600: '#181818',
                            500: '#222222',
                        },
                        neon: {
                            50:  '#e6fffb',
                            100: '#b3fff2',
                            200: '#80ffe9',
                            300: '#4dffe0',
                            400: '#00f0d4',
                            500: '#00d4bb',
                            600: '#00b89f',
                            700: '#009c85',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="font-sans bg-black text-gray-300 min-h-screen antialiased">
    <!-- Navigation -->
    <nav class="bg-black/90 backdrop-blur-xl border-b border-neon-400/10 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-14">
                <a href="{{ url_for('main.index') }}" class="flex items-center space-x-3 group">
                    <div class="w-8 h-8 bg-neon-400 rounded-lg flex items-center justify-center shadow-lg shadow-neon-400/30 group-hover:shadow-neon-400/50 transition-all">
                        <i class="fas fa-cube text-black text-xs font-bold"></i>
                    </div>
                    <span class="font-bold text-lg text-white tracking-tight">CME<span class="text-neon-400">3D</span></span>
                </a>

                <div class="hidden md:flex items-center space-x-1">
                    <a href="{{ url_for('main.index') }}" class="px-4 py-2 text-sm text-gray-500 hover:text-neon-400 rounded-lg hover:bg-neon-400/5 transition-all">
                        <i class="fas fa-folder-open mr-2"></i>Cases
                    </a>
                    <a href="{{ url_for('main.new_case') }}" class="px-4 py-2 text-sm bg-neon-400/10 text-neon-400 rounded-lg hover:bg-neon-400/20 transition-all font-medium">
                        <i class="fas fa-plus mr-2"></i>New Case
                    </a>
                </div>

                <div class="md:hidden">
                    <button id="mobile-menu-btn" class="text-gray-500 hover:text-neon-400 p-2 rounded-lg transition-colors">
                        <i class="fas fa-bars text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-black border-t border-neon-400/10">
            <div class="px-4 py-3 space-y-1">
                <a href="{{ url_for('main.index') }}" class="block px-4 py-2 text-gray-400 hover:text-neon-400 hover:bg-neon-400/5 rounded-lg transition-colors text-sm">
                    <i class="fas fa-folder-open mr-2"></i>Cases
                </a>
                <a href="{{ url_for('main.new_case') }}" class="block px-4 py-2 text-neon-400 hover:bg-neon-400/10 rounded-lg transition-colors text-sm">
                    <i class="fas fa-plus mr-2"></i>New Case
                </a>
            </div>
        </div>
    </nav>

    <main id="main-content" class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% if not request.endpoint or 'viewer' not in request.endpoint %}
    <footer class="border-t border-white/5 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <p class="text-gray-700 text-xs text-center">CME Anatomy Viewer</p>
        </div>
    </footer>
    {% endif %}

    <script>
        document.getElementById('mobile-menu-btn')?.addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        window.showError = function(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-red-500/90 backdrop-blur text-white px-5 py-3 rounded-xl shadow-2xl z-50 transform translate-x-full transition-transform duration-300 text-sm';
            toast.innerHTML = '<div class="flex items-center space-x-3"><i class="fas fa-exclamation-triangle"></i><span>' + message + '</span></div>';
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full'), 50);
            setTimeout(() => { toast.classList.add('translate-x-full'); setTimeout(() => toast.remove(), 300); }, 5000);
        };

        window.showSuccess = function(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-[#00f0d4] text-black px-5 py-3 rounded-xl shadow-2xl shadow-[#00f0d4]/20 z-50 transform translate-x-full transition-transform duration-300 text-sm font-medium';
            toast.innerHTML = '<div class="flex items-center space-x-3"><i class="fas fa-check-circle"></i><span>' + message + '</span></div>';
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full'), 50);
            setTimeout(() => { toast.classList.add('translate-x-full'); setTimeout(() => toast.remove(), 3000); }, 3000);
        };
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
