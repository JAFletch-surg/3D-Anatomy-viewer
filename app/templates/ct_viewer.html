<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CME3D - CT Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            overflow: hidden;
            background: #000;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .glass {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 212, 0.08);
        }
        #niivue-canvas {
            position: fixed;
            top: 48px; left: 0;
            width: 100vw;
            height: calc(100vh - 48px);
        }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Windowing slider styles */
        .window-slider {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px; outline: none;
        }
        .window-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: #00f0d4; cursor: pointer;
            border: 2px solid #000;
            box-shadow: 0 0 8px rgba(0,240,212,0.4);
        }
        .window-slider::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: #00f0d4; cursor: pointer;
            border: 2px solid #000;
            box-shadow: 0 0 8px rgba(0,240,212,0.4);
        }

        .view-btn { transition: all 0.15s; }
        .view-btn.active {
            background: rgba(0, 240, 212, 0.15);
            color: #00f0d4;
        }
        .preset-btn {
            transition: all 0.15s;
        }
        .preset-btn.active {
            background: rgba(0, 240, 212, 0.15);
            color: #00f0d4;
            border-color: rgba(0, 240, 212, 0.3);
        }
    </style>
</head>
<body>
    <!-- Nav Bar -->
    <div class="fixed top-0 left-0 right-0 glass z-50">
        <div class="flex items-center justify-between p-3 px-5">
            <a href="javascript:history.back()" class="flex items-center space-x-2 text-gray-500 hover:text-[#00f0d4] transition-colors text-sm">
                <i class="fas fa-arrow-left text-xs"></i>
                <span class="font-medium">Back</span>
            </a>
            <div class="bg-white/5 rounded-lg px-3 py-1.5 border border-white/5">
                <span class="text-gray-400 text-sm font-medium">CT Scan Viewer</span>
            </div>
            <!-- View mode buttons -->
            <div class="flex items-center gap-1">
                <button onclick="setView('axial')" id="btn-axial" class="view-btn px-3 py-1 text-xs text-gray-400 hover:text-[#00f0d4] rounded-lg">Axial</button>
                <button onclick="setView('coronal')" id="btn-coronal" class="view-btn px-3 py-1 text-xs text-gray-400 hover:text-[#00f0d4] rounded-lg">Coronal</button>
                <button onclick="setView('sagittal')" id="btn-sagittal" class="view-btn px-3 py-1 text-xs text-gray-400 hover:text-[#00f0d4] rounded-lg">Sagittal</button>
                <button onclick="setView('multi')" id="btn-multi" class="view-btn active px-3 py-1 text-xs rounded-lg font-medium">Multi</button>
                <button onclick="setView('render')" id="btn-render" class="view-btn px-3 py-1 text-xs text-gray-400 hover:text-[#00f0d4] rounded-lg">3D</button>
            </div>
        </div>
    </div>

    <!-- NiiVue Canvas -->
    <canvas id="niivue-canvas"></canvas>

    <!-- Windowing Controls Panel -->
    <div class="fixed top-16 right-5 glass rounded-2xl z-40" style="width: 260px;">
        <div class="p-5">
            <h3 class="text-[#00f0d4] font-semibold text-xs tracking-widest uppercase mb-4">
                <i class="fas fa-adjust mr-1"></i> Window
            </h3>

            <!-- Presets -->
            <div class="mb-4">
                <label class="text-gray-500 text-xs mb-2 block">Presets</label>
                <div class="grid grid-cols-3 gap-1.5">
                    <button onclick="setPreset('abdomen')" id="preset-abdomen" class="preset-btn active px-2 py-1.5 text-xs text-gray-400 bg-white/5 rounded-lg border border-white/5 hover:border-[#00f0d4]/20">Abdomen</button>
                    <button onclick="setPreset('lung')" id="preset-lung" class="preset-btn px-2 py-1.5 text-xs text-gray-400 bg-white/5 rounded-lg border border-white/5 hover:border-[#00f0d4]/20">Lung</button>
                    <button onclick="setPreset('bone')" id="preset-bone" class="preset-btn px-2 py-1.5 text-xs text-gray-400 bg-white/5 rounded-lg border border-white/5 hover:border-[#00f0d4]/20">Bone</button>
                    <button onclick="setPreset('brain')" id="preset-brain" class="preset-btn px-2 py-1.5 text-xs text-gray-400 bg-white/5 rounded-lg border border-white/5 hover:border-[#00f0d4]/20">Brain</button>
                    <button onclick="setPreset('liver')" id="preset-liver" class="preset-btn px-2 py-1.5 text-xs text-gray-400 bg-white/5 rounded-lg border border-white/5 hover:border-[#00f0d4]/20">Liver</button>
                    <button onclick="setPreset('vascular')" id="preset-vascular" class="preset-btn px-2 py-1.5 text-xs text-gray-400 bg-white/5 rounded-lg border border-white/5 hover:border-[#00f0d4]/20">Vascular</button>
                </div>
            </div>

            <!-- Window Width -->
            <div class="mb-3">
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-gray-500 text-xs">Width (WW)</label>
                    <span id="ww-value" class="text-[#00f0d4] text-xs font-mono">400</span>
                </div>
                <input type="range" id="ww-slider" class="window-slider" min="1" max="4000" value="400">
            </div>

            <!-- Window Level -->
            <div class="mb-4">
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-gray-500 text-xs">Level (WL)</label>
                    <span id="wl-value" class="text-[#00f0d4] text-xs font-mono">40</span>
                </div>
                <input type="range" id="wl-slider" class="window-slider" min="-1000" max="3000" value="40">
            </div>

            <!-- Colormap -->
            <div class="mb-3">
                <label class="text-gray-500 text-xs mb-1.5 block">Colormap</label>
                <div class="grid grid-cols-4 gap-1">
                    <button onclick="setColormap('gray')" class="cmap-btn px-2 py-1 text-xs text-gray-300 bg-white/5 rounded border border-white/5 hover:border-[#00f0d4]/20">Gray</button>
                    <button onclick="setColormap('hot')" class="cmap-btn px-2 py-1 text-xs text-gray-400 bg-white/5 rounded border border-white/5 hover:border-[#00f0d4]/20">Hot</button>
                    <button onclick="setColormap('cool')" class="cmap-btn px-2 py-1 text-xs text-gray-400 bg-white/5 rounded border border-white/5 hover:border-[#00f0d4]/20">Cool</button>
                    <button onclick="setColormap('bone')" class="cmap-btn px-2 py-1 text-xs text-gray-400 bg-white/5 rounded border border-white/5 hover:border-[#00f0d4]/20">Bone</button>
                </div>
            </div>

            <!-- Opacity (for 3D render mode) -->
            <div id="opacity-section" class="hidden">
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-gray-500 text-xs">3D Opacity</label>
                    <span id="opacity-value" class="text-[#00f0d4] text-xs font-mono">1.0</span>
                </div>
                <input type="range" id="opacity-slider" class="window-slider" min="0" max="100" value="100">
            </div>

            <!-- Crosshair toggle -->
            <div class="mt-3 pt-3 border-t border-white/5 flex items-center justify-between">
                <span class="text-gray-500 text-xs">Crosshair</span>
                <button id="crosshair-toggle" onclick="toggleCrosshair()" class="px-3 py-1 text-xs text-[#00f0d4] bg-[#00f0d4]/10 rounded-lg hover:bg-[#00f0d4]/20 transition-all">On</button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/90 flex items-center justify-center z-30">
        <div class="glass rounded-2xl p-8 text-center">
            <div class="w-10 h-10 border-2 border-[#00f0d4]/20 border-t-[#00f0d4] rounded-full mx-auto mb-5 animate-spin"></div>
            <div class="text-white font-medium text-sm">Loading CT Scan</div>
            <div class="text-gray-600 text-xs mt-2">This may take a moment...</div>
        </div>
    </div>

    <!-- NiiVue -->
    <script type="module">
        import { Niivue } from "https://esm.sh/@niivue/niivue@0.44.1";

        const nv = new Niivue({
            backColor: [0, 0, 0, 1],
            crosshairColor: [0, 0.94, 0.83, 0.5],
            show3Dcrosshair: true,
            multiplanarForceRender: true,
        });

        nv.attachToCanvas(document.getElementById("niivue-canvas"));
        window._nv = nv;

        // Window presets (WW, WL)
        const presets = {
            abdomen:  { ww: 400,  wl: 40 },
            lung:     { ww: 1500, wl: -600 },
            bone:     { ww: 2000, wl: 500 },
            brain:    { ww: 80,   wl: 40 },
            liver:    { ww: 150,  wl: 70 },
            vascular: { ww: 600,  wl: 200 },
        };

        const ctUrl = "/static/uploads/{{ ct_filename }}";

        nv.loadVolumes([{ url: ctUrl, colormap: "gray" }]).then(() => {
            document.getElementById("loading-overlay").style.display = "none";
            nv.setSliceType(nv.sliceTypeMultiplanar);
            // Apply default abdomen window
            applyWindow(400, 40);
        }).catch(err => {
            console.error("Failed to load CT:", err);
            document.getElementById("loading-overlay").innerHTML =
                '<div class="glass rounded-2xl p-8 text-center">' +
                '<div class="text-red-400 text-sm font-medium mb-2">Failed to load CT scan</div>' +
                '<div class="text-gray-600 text-xs mb-4">' + (err.message || 'Unknown error') + '</div>' +
                '<button onclick="location.reload()" class="px-4 py-2 bg-[#00f0d4]/10 text-[#00f0d4] rounded-lg text-sm">Retry</button>' +
                '</div>';
        });

        // Apply window width/level
        function applyWindow(ww, wl) {
            const calMin = wl - ww / 2;
            const calMax = wl + ww / 2;
            nv.volumes[0].cal_min = calMin;
            nv.volumes[0].cal_max = calMax;
            nv.updateGLVolume();

            document.getElementById('ww-slider').value = ww;
            document.getElementById('wl-slider').value = wl;
            document.getElementById('ww-value').textContent = ww;
            document.getElementById('wl-value').textContent = wl;
        }
        window.applyWindow = applyWindow;

        // View mode
        window.setView = function(view) {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + view)?.classList.add('active');

            const opacitySection = document.getElementById('opacity-section');

            switch(view) {
                case 'axial': nv.setSliceType(nv.sliceTypeAxial); opacitySection.classList.add('hidden'); break;
                case 'coronal': nv.setSliceType(nv.sliceTypeCoronal); opacitySection.classList.add('hidden'); break;
                case 'sagittal': nv.setSliceType(nv.sliceTypeSagittal); opacitySection.classList.add('hidden'); break;
                case 'multi': nv.setSliceType(nv.sliceTypeMultiplanar); opacitySection.classList.add('hidden'); break;
                case 'render': nv.setSliceType(nv.sliceTypeRender); opacitySection.classList.remove('hidden'); break;
            }
        };

        // Presets
        window.setPreset = function(name) {
            const p = presets[name];
            if (!p || !nv.volumes.length) return;
            applyWindow(p.ww, p.wl);
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('preset-' + name)?.classList.add('active');
        };

        // Colormap
        window.setColormap = function(name) {
            if (!nv.volumes.length) return;
            nv.volumes[0].colormap = name;
            nv.updateGLVolume();
        };

        // Crosshair
        let crosshairOn = true;
        window.toggleCrosshair = function() {
            crosshairOn = !crosshairOn;
            nv.opts.crosshairWidth = crosshairOn ? 1 : 0;
            nv.updateGLVolume();
            document.getElementById('crosshair-toggle').textContent = crosshairOn ? 'On' : 'Off';
        };

        // Slider events
        document.getElementById('ww-slider').addEventListener('input', function() {
            const ww = parseInt(this.value);
            const wl = parseInt(document.getElementById('wl-slider').value);
            document.getElementById('ww-value').textContent = ww;
            if (nv.volumes.length) applyWindow(ww, wl);
        });

        document.getElementById('wl-slider').addEventListener('input', function() {
            const wl = parseInt(this.value);
            const ww = parseInt(document.getElementById('ww-slider').value);
            document.getElementById('wl-value').textContent = wl;
            if (nv.volumes.length) applyWindow(ww, wl);
        });

        document.getElementById('opacity-slider').addEventListener('input', function() {
            const opacity = parseFloat(this.value) / 100;
            document.getElementById('opacity-value').textContent = opacity.toFixed(1);
            if (nv.volumes.length) {
                nv.volumes[0].opacity = opacity;
                nv.updateGLVolume();
            }
        });
    </script>
</body>
</html>
